
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Blood Bank</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <header class="topbar">
        <div class="brand">
            <span class="drop">♥</span> Blood Bank Management
        </div>

        <nav>
            <a href="index.html">Login</a>
            <a href="#">About</a>
        </nav>
    </header>

    <main class="form-page">
        <section class="form-card">
            <h1>Create Account</h1>
            <p class="muted">Register a new blood bank system user</p>

            <form id="registerForm">

                <div class="grid-2">
                    <div>
                        <label for="fullName">Full Name</label>
                        <input
                            id="fullName"
                            name="fullName"
                            type="text"
                            required
                            placeholder="Full name"
                        >
                    </div>

                    <div>
                        <label for="email">Email</label>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            required
                            placeholder="name@email.com"
                        >
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label for="phone">Phone</label>
                        <input
                            id="phone"
                            name="phone"
                            type="tel"
                            placeholder="+91 XXXXX XXXXX"
                        >
                    </div>

                    <div>
                        <label for="role">Role</label>
                        <select id="role" name="role" required>
                            <option value="Donor">Donor</option>
                            <option value="Recipient">Recipient</option>
                            <option value="Staff">Staff</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label for="password">Password</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            required
                            placeholder="Password"
                        >
                    </div>

                    <div>
                        <label for="confirmPassword">Confirm Password</label>
                        <input
                            id="confirmPassword"
                            name="confirmPassword"
                            type="password"
                            required
                            placeholder="Confirm password"
                        >
                    </div>
                </div>

                <div
                    id="registerMessage"
                    class="form-error"
                    role="alert"
                ></div>

                <button class="btn primary" type="submit">
                    Register
                </button>

                <a class="btn ghost" href="index.html">
                    Back to Login
                </a>

            </form>
        </section>
    </main>

    <!-- Keep your shared JavaScript file -->
    <script src="js/app.js"></script>

    <!-- Registration functionality -->
    <script>
        const registerForm = document.getElementById("registerForm");

        registerForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const fullName =
                document.getElementById("fullName").value.trim();

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const role =
                document.getElementById("role").value;

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const message =
                document.getElementById("registerMessage");

            const button =
                registerForm.querySelector('button[type="submit"]');

            message.textContent = "";

            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                return;
            }

            button.disabled = true;
            button.textContent = "Registering...";

            try {
                const response = await fetch(
                    "http://172.23.232.27:3000/api/register",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            fullName: fullName,
                            email: email,
                            phone: phone,
                            role: role,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (response.ok && data.success) {
                    alert("Registration successful! You can now login.");
                    window.location.href = "index.html";
                    return;
                }

                message.textContent =
                    data.message || "Registration failed. Please try again.";

            } catch (error) {
                console.error("Registration error:", error);

                message.textContent =
                    "Cannot connect to the server. Check that the backend is running and the server address is correct.";

            } finally {
                button.disabled = false;
                button.textContent = "Register";
            }
        });
    </script>

</body>
</html>
