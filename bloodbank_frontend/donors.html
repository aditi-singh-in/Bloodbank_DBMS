
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donors | Blood Bank</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar"></aside>

        <main class="content">
            <header class="page-head">
                <div>
                    <h1>Donor Management</h1>
                    <p>Manage registered blood donors</p>
                </div>

                <button class="btn primary" onclick="openModal('Add New Donor')">
                    ＋ Add New Donor
                </button>
            </header>

            <section class="panel">
                <div class="toolbar">
                    <input
                        id="tableSearch"
                        type="search"
                        oninput="filterTable()"
                        placeholder="🔎 Search donor name or blood group..."
                    >

                    <select id="donorBloodFilter" onchange="filterTable()">
                        <option value="">All Blood Groups</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>

                <div class="table-wrap">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th>Donor ID</th>
                                <th>Name</th>
                                <th>Blood Group</th>
                                <th>Phone</th>
                                <th>Last Donation</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="donorTableBody">
                            <tr>
                                <td colspan="7">Loading donors...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
