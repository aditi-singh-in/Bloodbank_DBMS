<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Reports | Blood Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bbp-page bbp-reports">
<div class="app">
    <aside class="sidebar"></aside>

    <main class="content">
        <header class="page-head">
            <div>
                <span class="bbp-eyebrow">INSIGHTS</span>
                <h1>Reports &amp; Analytics</h1>
                <p>Quick overview of system performance</p>
            </div>
            <button class="btn ghost" onclick="toast('Report generated (demo)')">↓ Generate Report</button>
        </header>

        <div class="report-grid">
            <section class="panel">
                <h2>Monthly Donations</h2>
                <div class="fake-chart">
                    <div style="height:35%"><span>May</span></div>
                    <div style="height:55%"><span>Jun</span></div>
                    <div style="height:48%"><span>Jul</span></div>
                    <div style="height:78%"><span>Aug</span></div>
                    <div style="height:92%"><span>Sep</span></div>
                </div>
            </section>

            <section class="panel">
                <h2>Request Summary</h2>
                <div class="summary-row"><span>Approved</span><b>68%</b></div>
                <div class="summary-row"><span>Pending</span><b>21%</b></div>
                <div class="summary-row"><span>Rejected</span><b>11%</b></div>
                <div class="progress big"><i style="width:68%"></i></div>
            </section>
        </div>

        <footer class="bbp-footer">♥ Every drop counts — thank you for saving lives.</footer>
    </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
