<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipients | Blood Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bbp-page bbp-recipients">
<div class="app">
    <aside class="sidebar"></aside>

    <main class="content">
        <header class="page-head">
            <div>
                <span class="bbp-eyebrow">PATIENT CARE</span>
                <h1>Recipient Management</h1>
                <p>Manage patient and recipient details</p>
            </div>
            <button class="btn primary" onclick="openModal('Add Recipient Details')">
                ＋ Add Recipient
            </button>
        </header>

        <section class="panel">
            <div class="toolbar">
                <input id="tableSearch" oninput="filterTable()"
                       placeholder="🔎 Search recipient...">
            </div>

            <div class="table-wrap">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Recipient ID</th>
                            <th>Patient Name</th>
                            <th>Blood Group</th>
                            <th>Contact</th>
                            <th>Address</th>
                            <th>Age</th>
                            <th>Gender</th>
                        </tr>
                    </thead>
                    <tbody id="recipientTableBody">
                        <tr><td colspan="7">Loading recipients...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <footer class="bbp-footer">♥ Every drop counts — thank you for saving lives.</footer>
    </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
