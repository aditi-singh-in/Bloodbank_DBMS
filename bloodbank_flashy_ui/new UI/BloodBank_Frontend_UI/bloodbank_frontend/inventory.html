
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory | Blood Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bbp-page bbp-inventory">
    <div class="app">
        <aside class="sidebar"></aside>

        <main class="content">
            <header class="page-head">
                <div>
                    <span class="bbp-eyebrow">STOCK CONTROL</span>
                    <h1>Blood Inventory</h1>
                    <p>Current blood stock and availability</p>
                </div>

                <button class="btn primary" onclick="openModal('Add Blood Stock')">
                    ＋ Add Stock
                </button>
            </header>

            <section class="inventory-cards" id="inventoryCards"></section>

            <section class="panel">
                <div class="panel-head">
                    <h2>Inventory Details</h2>
                    <span class="muted">Updated just now</span>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Blood Group</th>
                                <th>Available Units</th>
                                <th>Reserved</th>
                                <th>Expiry Alert</th>
                                <th>Stock Level</th>
                            </tr>
                        </thead>

                        <tbody id="inventoryTableBody">
                            <tr>
                                <td colspan="5">Loading inventory...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <footer class="bbp-footer">♥ Every drop counts — thank you for saving lives.</footer>
        </main>
    </div>

    <script src="js/app.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof loadInventory === "function") {
                loadInventory();
            }
        });
    </script>
</body>
</html>
